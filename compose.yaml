services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-order_to_audit}
      POSTGRES_USER: ${POSTGRES_USER:-order_to_audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    environment: &api_environment
      API_SECRET_KEY: ${API_SECRET_KEY:-local-migration-demo-secret-change-for-hosting}
      POSTGRES_DB: ${POSTGRES_DB:-order_to_audit}
      POSTGRES_USER: ${POSTGRES_USER:-order_to_audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_HOST: db
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 30
      start_period: 15s
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: api/Dockerfile
      target: regression
    environment:
      <<: *api_environment
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: regression-tests-only
      DJANGO_DEBUG: "0"
    command: ["python", "manage.py", "test"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
